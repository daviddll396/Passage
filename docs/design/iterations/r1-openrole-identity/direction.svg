<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">OpenRole identity direction</title>
  <desc id="desc">A warm editorial composition with stacked role cards, dark ink, deep green and a small orange signal.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#F5F1E8"/><stop offset="1" stop-color="#E7E0D2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="28"/></filter>
    <clipPath id="art"><rect x="790" y="115" width="730" height="720" rx="5"/></clipPath>
  </defs>
  <rect width="1600" height="1000" fill="#171916"/>
  <rect x="40" y="40" width="1520" height="920" fill="url(#paper)"/>
  <rect x="790" y="115" width="730" height="720" fill="#111310" opacity=".13" filter="url(#shadow)"/>
  <g font-family="Arial, sans-serif" fill="#242723">
    <text x="105" y="155" font-size="21" font-weight="700" letter-spacing="4">OPENROLE</text>
    <circle cx="300" cy="147" r="5" fill="#EE5B35"/>
    <text x="105" y="219" font-size="14" font-weight="700" letter-spacing="2.5" fill="#547161">ROLE DISCOVERY, MADE HUMAN</text>
    <text x="100" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="82" letter-spacing="-3">Search for work</text>
    <text x="100" y="480" font-family="Georgia, 'Times New Roman', serif" font-size="82" letter-spacing="-3">in your own</text>
    <text x="100" y="570" font-family="Georgia, 'Times New Roman', serif" font-size="82" letter-spacing="-3" fill="#174735">words.</text>
    <text x="105" y="646" font-size="20" fill="#555C53">Tell OpenRole what you want to do.</text>
    <text x="105" y="677" font-size="20" fill="#555C53">Find listings that fit your next move.</text>
    <rect x="105" y="734" width="205" height="58" rx="3" fill="#174735"/>
    <text x="138" y="771" font-size="16" font-weight="700" fill="#F7F4EB">Explore roles</text>
    <text x="105" y="875" font-size="12" letter-spacing="2" fill="#777A70">A PROPOSED BRAND DIRECTION</text>
    <text x="105" y="904" font-size="12" fill="#777A70">Warm editorial clarity · practical product detail · quiet confidence</text>
  </g>
  <image href="card-stack.png" x="790" y="115" width="730" height="720" preserveAspectRatio="xMidYMid slice" clip-path="url(#art)"/>
  <rect x="790" y="115" width="730" height="720" fill="none" stroke="#174735" stroke-width="2"/>
  <rect x="1415" y="84" width="115" height="52" fill="#174735"/>
  <text x="1432" y="116" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.7" fill="#F7F4EB">OPENROLE</text>
  <circle cx="1494" cy="806" r="20" fill="#EE5B35"/>
  <circle cx="1494" cy="806" r="6" fill="#171916"/>
</svg>
